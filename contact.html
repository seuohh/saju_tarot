<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제휴 문의 - 사주·타로·관상·로또</title>
<meta name="description" content="사주·타로·관상·로또 서비스와의 광고·콘텐츠·데이터 제휴, 언론 문의를 남겨주세요.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://saju-tarot.com/contact">
<meta name="theme-color" content="#0B0A08">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%9D%3C/text%3E%3C/svg%3E">
<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1069417115729999" crossorigin="anonymous"></script>
<style>
:root{
  --ink:#EDE6D4;
  --ink-soft:#B3A991;
  --paper:#0B0A08;
  --paper-raised:#17140F;
  --paper-sunken:#000000;
  --line:rgba(237,230,212,0.13);
  --line-strong:rgba(237,230,212,0.24);
  --accent:#E2694F;
  --accent-ink:#241109;
  --water:#7DA2C9;
  --shadow:0 1px 2px rgba(0,0,0,0.4), 0 12px 32px -14px rgba(0,0,0,0.6);
  --font:"맑은 고딕","Malgun Gothic",sans-serif;
  --fs-hero:clamp(30px,5.5vw,44px);
  --fs-h2:20px;
  --fs-body:14.5px;
  --fs-caption:12.5px;
  --fs-tiny:11px;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font);line-height:1.65;-webkit-font-smoothing:antialiased;
}
[hidden]{display:none!important;}
a{color:var(--accent);}
h1,h2{text-wrap:balance;margin:0;}
.wrap{max-width:640px;margin:0 auto;padding:0 20px 96px;}
.bg-wash{
  position:relative;overflow:hidden;
  background:radial-gradient(ellipse 640px 320px at 12% -8%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%),
             radial-gradient(ellipse 520px 300px at 92% 6%, color-mix(in srgb, var(--water) 10%, transparent), transparent 60%);
}
header.hero{padding:64px 20px 40px;text-align:center;position:relative;}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:var(--fs-caption);
  letter-spacing:0.14em;color:var(--accent);margin-bottom:18px;
}
.eyebrow::before,.eyebrow::after{content:"";width:20px;height:1px;background:var(--accent);opacity:0.5;}
h1.title{font-size:var(--fs-hero);font-weight:900;letter-spacing:-0.01em;}
p.lede{max-width:480px;margin:20px auto 0;color:var(--ink-soft);font-size:var(--fs-body);}
.back-link{margin-top:18px;font-size:var(--fs-caption);}

.ledger{
  background:var(--paper-raised);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);padding:32px;margin-top:8px;
}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.field label{font-size:var(--fs-caption);font-weight:600;color:var(--ink-soft);letter-spacing:0.02em;}
.field .req{color:var(--accent);}
.field input[type="text"],
.field input[type="email"],
.field select,
.field textarea{
  font:inherit;font-size:15px;padding:11px 12px;
  border:1px solid var(--line-strong);border-radius:9px;
  background:var(--paper);color:var(--ink);resize:vertical;
}
.field textarea{min-height:140px;line-height:1.55;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
.hp-field{position:absolute;left:-9999px;top:-9999px;}
.submit-row{display:flex;justify-content:flex-end;margin-top:8px;}
button.primary{
  font:inherit;font-weight:700;font-size:15px;color:var(--accent-ink);
  background:var(--accent);border:none;border-radius:11px;
  padding:13px 26px;cursor:pointer;letter-spacing:0.01em;
  box-shadow:0 6px 16px -6px color-mix(in srgb, var(--accent) 60%, transparent);
}
button.primary:hover{filter:brightness(1.06);}
button.primary:disabled{opacity:0.6;cursor:default;filter:none;}
button.primary:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
.form-note{margin-top:14px;font-size:var(--fs-tiny);color:var(--ink-soft);text-align:center;}
.form-error{margin-top:14px;font-size:var(--fs-caption);color:var(--accent);text-align:center;}

.success{
  background:var(--paper-raised);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);padding:48px 32px;margin-top:8px;text-align:center;
}
.success .glyph{font-size:40px;margin-bottom:14px;}
.success h2{font-size:var(--fs-h2);font-weight:700;margin-bottom:8px;}
.success p{color:var(--ink-soft);font-size:var(--fs-body);margin:0;}

footer{max-width:640px;margin:48px auto 0;padding:24px 20px 0;border-top:1px solid var(--line);color:var(--ink-soft);font-size:var(--fs-caption);text-align:center;}
footer .flinks a{color:var(--ink-soft);text-decoration:none;margin:0 6px;}
footer .flinks a:hover{text-decoration:underline;}
footer .fcopy{margin-top:10px;}
footer .visitor-counter{margin-top:6px;font-size:var(--fs-tiny);color:var(--ink-soft);opacity:0.8;}
footer .visitor-counter b{font-weight:700;color:var(--accent);}
</style>
</head>
<body>
<div class="bg-wash">
<header class="hero">
  <div class="eyebrow">제휴 · 문의</div>
  <h1 class="title">제휴 문의</h1>
  <p class="lede">사주·타로·관상·로또와의 광고·콘텐츠·데이터 제휴, 언론 및 기타 문의를 남겨주시면 확인 후 이메일로 회신드립니다.</p>
  <p class="back-link"><a href="index.html">← 홈으로 돌아가기</a></p>
</header>
</div>

<div class="wrap">

  <form class="ledger" id="contactForm" action="https://formspree.io/f/myeylopr" method="POST">
    <div class="field">
      <label for="fName">이름 <span class="req">*</span></label>
      <input type="text" id="fName" name="name" placeholder="예: 홍길동" maxlength="40" required>
    </div>
    <div class="field">
      <label for="fEmail">이메일 <span class="req">*</span></label>
      <input type="email" id="fEmail" name="email" placeholder="you@example.com" required>
    </div>
    <div class="field">
      <label for="fCompany">회사 · 브랜드명 (선택)</label>
      <input type="text" id="fCompany" name="company" placeholder="예: (주)홍길동컴퍼니" maxlength="60">
    </div>
    <div class="field">
      <label for="fType">문의 유형</label>
      <select id="fType" name="inquiry_type">
        <option value="광고/배너 제휴">광고 · 배너 제휴</option>
        <option value="콘텐츠/데이터 제휴">콘텐츠 · 데이터 제휴</option>
        <option value="언론/미디어 문의">언론 · 미디어 문의</option>
        <option value="기타">기타</option>
      </select>
    </div>
    <div class="field">
      <label for="fMessage">문의 내용 <span class="req">*</span></label>
      <textarea id="fMessage" name="message" placeholder="제안 내용을 자유롭게 작성해주세요." required></textarea>
    </div>

    <!-- 스팸 방지용 허니팟 필드 (사람 눈에는 보이지 않음) -->
    <input type="text" name="_gotcha" class="hp-field" tabindex="-1" autocomplete="off">
    <input type="hidden" name="_subject" value="[사주·타로·관상·로또] 제휴 문의가 도착했습니다">

    <div class="submit-row">
      <button type="submit" class="primary" id="submitBtn">문의 보내기</button>
    </div>
    <p class="form-note">보내주신 이메일로만 회신드리며, 입력하신 정보는 문의 응대 외 다른 목적으로 사용하지 않습니다.</p>
    <p class="form-error" id="formError" hidden>전송에 실패했습니다. 잠시 후 다시 시도하시거나 이메일로 직접 연락해주세요.</p>
  </form>

  <div class="success" id="successCard" hidden>
    <div class="glyph">✅</div>
    <h2>문의가 접수되었습니다</h2>
    <p>보내주신 내용을 확인한 뒤 입력하신 이메일로 회신드리겠습니다.</p>
  </div>

  <footer>
    <div class="flinks">
      <a href="index.html">사주 · 타로 · 관상</a>·<a href="lotto.html">로또 번호 생성기</a>·<a href="terms.html">이용약관</a>·<a href="privacy.html">개인정보처리방침</a>
    </div>
    <div class="fcopy" id="copyright"></div>
    <div class="visitor-counter" id="visitorCounter" hidden></div>
  </footer>
</div>

<script>
(function(){
"use strict";
document.getElementById('copyright').textContent='© '+new Date().getFullYear()+' 사주·타로·관상·로또';

/* 사주/로또 페이지와 동일한 /api/visitor-count(Cloudflare Pages
   Functions + KV)를 사용해 사이트 전체 누적 방문 수를 센다. */
(async function initVisitorCounter(){
  try{
    const VISITOR_SESSION_KEY='visitorCountedThisSession';
    let alreadyCounted=false;
    try{ alreadyCounted=sessionStorage.getItem(VISITOR_SESSION_KEY)==='1'; }catch(error){ /* 무시 */ }
    const res=await fetch('/api/visitor-count',{method:alreadyCounted?'GET':'POST'});
    if(!res.ok) return;
    const data=await res.json();
    if(typeof data.count!=='number') return;
    if(!alreadyCounted){
      try{ sessionStorage.setItem(VISITOR_SESSION_KEY,'1'); }catch(error){ /* 무시 */ }
    }
    const el=document.getElementById('visitorCounter');
    if(!el) return;
    el.innerHTML='지금까지 <b>'+data.count.toLocaleString('ko-KR')+'</b>명이 다녀갔어요';
    el.hidden=false;
  }catch(error){
    // API를 사용할 수 없는 환경(로컬 테스트 등)에서는 카운터를 조용히 숨긴 채로 둔다
  }
})();

const form=document.getElementById('contactForm');
const submitBtn=document.getElementById('submitBtn');
const errorEl=document.getElementById('formError');

form.addEventListener('submit',async function(e){
  e.preventDefault();
  errorEl.hidden=true;
  submitBtn.disabled=true;
  submitBtn.textContent='보내는 중...';
  try{
    const res=await fetch(form.action,{
      method:'POST',
      body:new FormData(form),
      headers:{'Accept':'application/json'}
    });
    if(res.ok){
      form.hidden=true;
      document.getElementById('successCard').hidden=false;
    }else{
      throw new Error('submit failed');
    }
  }catch(error){
    errorEl.hidden=false;
    submitBtn.disabled=false;
    submitBtn.textContent='문의 보내기';
  }
});
})();
</script>
</body>
</html>
